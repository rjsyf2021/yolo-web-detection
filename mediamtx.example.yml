# LAN configuration for this app. HTTP signalling and RTSP stay on localhost.
logLevel: info
rtsp: true
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]
rtmp: false
hls: false
srt: false
moq: false
webrtc: true
webrtcAddress: 127.0.0.1:8889
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ""
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: [REPLACE_WITH_SERVER_LAN_IP]
authInternalUsers:
  - user: any
    ips: [127.0.0.1, '::1']
    permissions:
      - action: publish
        path: '~^yolo-[a-f0-9]{32}$'
      - action: read
        path: '~^yolo-[a-f0-9]{32}$'
paths:
  '~^yolo-[a-f0-9]{32}$':
    source: publisher
